<!doctype html>
<meta charset="utf-8">
<title>Cartoon outline WebGL checks</title>
<script type="importmap">{"imports":{"three":"/vendor/three/0.186.0/three.module.js"}}</script>
<style>body{font:15px system-ui;background:#f2efe9;margin:16px}button{padding:8px}canvas{display:block;margin-top:12px;max-width:100%}pre{white-space:pre-wrap}</style>
<button id="run">Run WebGL checks</button>
<pre id="status">Ready: same furniture, adjacent furniture, selection, walls, DPR and resize.</pre>
<canvas></canvas>
<details><summary>Check details</summary><pre id="details"></pre></details>
<script type="module">
import * as THREE from "three";
import { createCartoonOutline } from "/layout-view/render/outline/cartoon_outline.js";
import { mountLayout } from "/layout-view/render/room/layout_scene.js";
import { addFurnitureInk } from "/layout-view/render/outline/layout_ink.js";
import { addDesk, addChair, addSofa, wallGeometry, prismGeometry, ROOM_LAYER } from "/layout-view/render/room/layout_meshes.js";
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector("canvas"), antialias: true, logarithmicDepthBuffer: true, preserveDrawingBuffer: true });
renderer.setClearColor(0xf2efe9, 1);
const scene = new THREE.Scene(), roots = new THREE.Group(); scene.add(roots);
const fill = new THREE.HemisphereLight(0xfffdfa, 0xdcd5c9, 1.1);
const key = new THREE.DirectionalLight(0xfffaf0, 0.95); key.position.set(-1500, 3000, 2500);
fill.layers.enable(ROOM_LAYER); key.layers.enable(ROOM_LAYER); scene.add(fill, key);
let camera = new THREE.OrthographicCamera(-300, 300, 200, -200, 1, 3000);
camera.layers.enable(ROOM_LAYER);
camera.position.z = 1000; camera.lookAt(0, 0, 0);
const outline = createCartoonOutline(renderer);
const geometry = new THREE.BoxGeometry(100, 200, 100);
const parts = [-50, 50].map((x, i) => {
  const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0xbbaa99 }));
  mesh.position.x = x;
  mesh.userData = { itemId: `item-${i}`, cartoonInk: { color: 0x28231d } };
  roots.add(mesh); return mesh;
});
const wall = new THREE.Mesh(new THREE.BoxGeometry(240, 240, 10), new THREE.MeshBasicMaterial({ color: 0xe4ddcf, transparent: true, depthWrite: false, opacity: 0.5 }));
wall.position.z = 100; wall.visible = false; roots.add(wall);
function size(width, height, ratio) {
  renderer.setPixelRatio(ratio); renderer.setSize(width, height);
  camera.left = -width / 2; camera.right = width / 2; camera.top = height / 2; camera.bottom = -height / 2;
  camera.updateProjectionMatrix();
}
let framePixels = null;
function render(effect = true) {
  outline.prepare([roots], camera);
  renderer.autoClear = true; renderer.render(scene, camera);
  if (effect) outline.draw([roots], camera);
  framePixels = null;
}
function pixel(x, y) {
  const ratio = renderer.getPixelRatio(), gl = renderer.getContext();
  if (x < 0 || y < 0 || x >= gl.drawingBufferWidth / ratio || y >= gl.drawingBufferHeight / ratio) throw new Error(`Pixel outside canvas: ${x}, ${y}`);
  if (!framePixels) {
    framePixels = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
    gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, framePixels);
  }
  const offset = ((gl.drawingBufferHeight - 1 - Math.floor((y + 0.5) * ratio)) * gl.drawingBufferWidth + Math.floor((x + 0.5) * ratio)) * 4;
  return [...framePixels.slice(offset, offset + 3)];
}
const dark = rgb => Math.max(...rgb) < 85;
const equal = (a, b) => a.every((value, i) => Math.abs(value - b[i]) <= 2);
function screen(point) {
  const p = point.clone().project(camera), size = renderer.getSize(new THREE.Vector2());
  return [(p.x + 1) * size.x / 2, (1 - p.y) * size.y / 2];
}
function edgePixel(point, direction, pixels = 1.5) {
  const a = screen(point), b = screen(point.clone().add(direction));
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  return pixel(a[0] + pixels * (b[0] - a[0]) / len, a[1] + pixels * (b[1] - a[1]) / len);
}
function inkWidth(point, outward) {
  const p = screen(point);
  let total = 0;
  for (let d = 0; d < 5; d++) {
    const offset = axis => outward[axis] < 0 ? -(d + 1) : outward[axis] > 0 ? d : 0;
    const rgb = pixel(Math.round(p[0]) + offset(0), Math.round(p[1]) + offset(1));
    total += (242 - rgb[0]) / (242 - 40);
  }
  return total;
}
function contactChecks(check) {
  const orthographic = camera;
  roots.clear();
  const backWall = new THREE.Mesh(wallGeometry([[-1000, -100, -100, 4000, 0, 2000]]), new THREE.MeshBasicMaterial({ color: 0xd8d0c2 }));
  roots.add(backWall);
  camera.far = 20000;
  for (const [add, name, width, depth, height] of [[addDesk, "desk", 1200, 600, 750], [addChair, "chair", 600, 600, 850], [addSofa, "sofa", 1800, 900, 850]]) {
    const group = new THREE.Group(), meshes = [];
    roots.add(group);
    add(group, meshes, { id: name, width, depth, height, z_start: 0,
      footprint: [[0, 0], [width, 0], [width, depth], [0, depth]],
    }, false, false, addFurnitureInk);
    const bounds = new THREE.Box3().setFromObject(group);
    group.position.z = -bounds.min.z;
    // 椅子的真实后立柱缩在足迹里；选其柱顶的后棱，其余选桌面/靠背顶后棱。
    const body = meshes[0];
    body.geometry.computeBoundingBox();
    const local = body.geometry.boundingBox;
    const contact = new THREE.Vector3((local.min.x + local.max.x) / 2, local.max.y, local.min.z);
    for (const [w, h, ratio, view] of [[600, 400, 1, "right"], [600, 400, 2, "right"], [900, 600, 2, "left"], [900, 600, 1, "perspective"]]) {
      document.querySelector("#status").textContent = `Checking ${name} ${w}x${h}@${ratio} ${view}`;
      camera = view === "perspective" ? new THREE.PerspectiveCamera(48, w / h, 1, 20000) : orthographic;
      camera.layers.enable(ROOM_LAYER);
      size(w, h, ratio);
      camera.left = -width * 1.5; camera.right = width * 1.5;
      camera.top = width * 1.5 * h / w; camera.bottom = -camera.top;
      camera.position.set(width * (view === "left" ? -0.3 : 1.3), height + 1400, depth + 2200);
      camera.lookAt(width / 2, height / 2, depth / 3);
      camera.updateProjectionMatrix(); camera.updateMatrixWorld(true);
      for (const color of [0x28231d, 0xf59e0b, 0xd93838]) {
        meshes.forEach(mesh => { mesh.userData.cartoonInk.color = color; mesh.userData.ink.material.color.setHex(color); });
        render(false);
        const point = contact.clone().applyMatrix4(body.matrixWorld);
        const before = edgePixel(point, new THREE.Vector3(0, 0, -1));
        render();
        const after = edgePixel(point, new THREE.Vector3(0, 0, -1));
        check(equal(before, after), `${name}@${w}x${h}/${ratio}/${view}/${color.toString(16)}: wall contact has no thick rim`, { before, after });
        const baseZ = group.position.z;
        for (const gap of [2,80]) {
          group.position.z = baseZ + gap;
          render(false);
          const freePoint = contact.clone().applyMatrix4(body.matrixWorld);
          const freeBefore = edgePixel(freePoint, new THREE.Vector3(0, 0, -1));
          render();
          const freeAfter = edgePixel(freePoint, new THREE.Vector3(0, 0, -1));
          check(!equal(freeBefore, freeAfter), `${name}@${w}x${h}/${ratio}/${view}/${color.toString(16)}: rim returns with a ${gap}mm gap`, { freeBefore, freeAfter });
        }
        group.position.z = baseZ;
      }
    }
    roots.remove(group);
  }
  // 留下实际家具画面用于目视核对：贴墙的书桌与沙发，以及足迹贴墙但立柱仍退让的椅子。
  roots.clear(); roots.add(backWall);
  camera = orthographic;
  size(1000, 600, 1);
  for (const [add, x, width, depth, height] of [[addDesk, 0, 1000, 600, 750], [addChair, 1200, 600, 600, 850], [addSofa, 2050, 1600, 900, 850]]) {
    add(roots, [], { id: `preview-${x}`, width, depth, height, z_start: 0,
      footprint: [[x, 0], [x + width, 0], [x + width, depth], [x, depth]],
    }, false, false, addFurnitureInk);
  }
  camera.left = -2300; camera.right = 2300; camera.top = 1380; camera.bottom = -1380;
  camera.position.set(4500, 2600, 4000); camera.lookAt(1800, 450, 200);
  camera.updateProjectionMatrix(); render();
}

function floorChecks(check) {
  roots.clear();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6000, 5000), new THREE.MeshBasicMaterial({color:0xd8d0c2}));
  floor.rotation.x = -Math.PI / 2;
  floor.userData.floorContact = true;
  roots.add(floor);
  const cabinet = new THREE.Mesh(prismGeometry([[0,0],[900,0],[900,350],[0,350]],0,1800), new THREE.MeshBasicMaterial({color:0xbbaa99}));
  addFurnitureInk(cabinet,{itemId:"grounded-bookcase",color:0x28231d});
  roots.add(cabinet);
  for (const [w,h,ratio,view,span] of [[600,400,1,"right",1800],[600,400,2,"left",1800],[900,600,2,"perspective",1800],[600,400,1,"far",3500]]) {
    camera = view === "perspective" ? new THREE.PerspectiveCamera(48,w/h,1,20000) : new THREE.OrthographicCamera();
    size(w,h,ratio);
    camera.left=-span; camera.right=span; camera.top=span*h/w; camera.bottom=-camera.top;
    camera.far=20000;
    camera.position.set(view === "left" ? -2000 : 2800,2400,3600); camera.lookAt(450,850,175);
    camera.updateProjectionMatrix(); camera.updateMatrixWorld(true);
    for (const color of [0x28231d,0xf59e0b,0xd93838]) {
      cabinet.userData.cartoonInk.color=color; cabinet.userData.ink.material.color.setHex(color);
      for (const gap of [0,2,80]) {
        cabinet.position.y=gap;
        const point=new THREE.Vector3(450,gap,350);
        render(false); const before=edgePixel(point,new THREE.Vector3(0,-1,0));
        render(); const after=edgePixel(point,new THREE.Vector3(0,-1,0));
        check(gap ? !equal(before,after) : equal(before,after),
          `bookcase floor @${w}/${ratio}/${view}/${color.toString(16)}/${gap}mm: ${gap ? "lifted rim returns" : "no thick contact rim"}`, {before,after});
      }
      cabinet.position.y=0;
      const top=new THREE.Vector3(450,1800,0);
      render(false); const before=edgePixel(top,new THREE.Vector3(0,1,0));
      render(); const after=edgePixel(top,new THREE.Vector3(0,1,0));
      check(!equal(before,after),`bookcase floor @${w}/${ratio}/${view}/${color.toString(16)}: top rim remains`,{before,after});
    }
  }
}

function detachedSofaChecks(check) {
  roots.clear();
  const group = new THREE.Group(); roots.add(group);
  addSofa(group, [], {id:"detached-sofa", width:1000, depth:850, height:850, z_start:0,
    footprint:[[0,80],[1000,80],[1000,930],[0,930]],
  }, false, false, addFurnitureInk);
  camera = new THREE.OrthographicCamera(-1000,1000,750,-750,1,20000);
  camera.layers.enable(ROOM_LAYER);
  for (const ratio of [1,2]) for (const side of [-1,1]) {
    size(600,450,ratio);
    camera.left=-1000; camera.right=1000; camera.top=750; camera.bottom=-750;
    camera.position.set(500+side*1800,1700,2300); camera.lookAt(500,400,450);
    camera.updateProjectionMatrix();
    render(false);
    // 扫过整体四周的轮廓，比较打开描边前后的覆盖，不能只剩内部细线。
    const probes = [];
    for (const y of [170,210,250,290]) {
      const occupied=[];
      for (let x=20;x<580;x++) if (!equal(pixel(x,y),[242,239,233])) occupied.push(x);
      if (!occupied.length) continue;
      probes.push([occupied[0],y,-1,0],[occupied.at(-1),y,1,0]);
    }
    for (const x of [240,300,360]) {
      const occupied=[];
      for (let y=20;y<430;y++) if (!equal(pixel(x,y),[242,239,233])) occupied.push(y);
      if (occupied.length) probes.push([x,occupied[0],0,-1],[x,occupied.at(-1),0,1]);
    }
    const before=probes.map(([x,y,dx,dy])=>[0,1,2,3].map(d=>pixel(x+dx*d,y+dy*d)));
    render();
    const after=probes.map(([x,y,dx,dy])=>[0,1,2,3].map(d=>pixel(x+dx*d,y+dy*d)));
    const contrasts=after.map((row,i)=>row.map((rgb,d)=>Math.max(...rgb.map((v,j)=>before[i][d][j]-v))));
    check(probes.length===14 && contrasts.every(row=>row.reduce((a,b)=>a+b,0)>240),
      `detached sofa @${ratio}/${side}: every side keeps a visible outer rim`, {contrasts});
  }
}
document.querySelector("#run").onclick = () => {
  roots.clear(); roots.add(...parts, wall);
  camera.position.set(0, 0, 1000); camera.lookAt(0, 0, 0);
  const results = [];
  const check = (condition, name, detail) => { results.push({ name, pass: Boolean(condition), detail }); };
  for (const [width, height, ratio] of [[600, 400, 1], [600, 400, 2], [900, 600, 2]]) {
    size(width, height, ratio);
    const x = width / 2, y = height / 2, tag = `${width}x${height}@${ratio}`;
    wall.visible = false;
    parts.forEach(part => { part.userData.itemId = "same"; part.userData.cartoonInk.color = 0x28231d; });
    render();
    check(!dark(pixel(x, y)), `${tag}: same-item seam stays light`, pixel(x, y));
    const upper = inkWidth(new THREE.Vector3(0, 100, 50), [0, -1]);
    const lower = inkWidth(new THREE.Vector3(0, -100, 50), [0, 1]);
    const near = inkWidth(new THREE.Vector3(100, 0, 50), [1, 0]);
    check(upper > 0.3 && lower > upper + 0.25 && lower < 3, `${tag}: light-facing rim is thinner than shaded rim`, {upper, lower});
    camera.zoom = 0.4; camera.updateProjectionMatrix(); render();
    const far = inkWidth(new THREE.Vector3(100, 0, 50), [1, 0]);
    check(far > 0.15 && far < near - 0.25, `${tag}: zoomed-out furniture has a lighter, thinner rim`, {near, far});
    camera.zoom = 1; camera.updateProjectionMatrix(); render();
    parts[1].userData.itemId = "other";
    render();
    check(dark(pixel(x, y)), `${tag}: adjacent same-color furniture retains boundary`, pixel(x, y));
    parts[1].position.set(0, 0, 20);
    render();
    check(dark(pixel(x - 50, y)), `${tag}: overlapping furniture retains visible boundary`, pixel(x - 50, y));
    check(!dark(pixel(x, y)), `${tag}: foreground furniture hides background edge`, pixel(x, y));
    parts[1].position.set(50, 0, 0);
    parts[1].userData.cartoonInk.color = 0xf59e0b;
    render();
    const selected = pixel(x, y);
    check(selected[0] > 170 && selected[1] > 80 && selected[2] < 100, `${tag}: selected boundary keeps orange`, selected);
    parts.forEach(part => { part.userData.itemId = "same"; part.userData.cartoonInk.color = 0x28231d; });
    wall.visible = true; wall.material.opacity = 0.5;
    render(false); const before = pixel(x - 50, y);
    render(); const after = pixel(x - 50, y);
    check(equal(before, after), `${tag}: transparent wall does not paint furniture interior`, { before, after });
    wall.material.opacity = 1;
    render(false); const covered = pixel(x - 102, y);
    render();
    check(equal(covered, pixel(x - 102, y)), `${tag}: opaque wall hides covered outline`);
  }
  wall.visible = false; parts[1].userData.itemId = "other";
  render();
  contactChecks(check);
  floorChecks(check);
  roomChecks(check);
  detachedSofaChecks(check);
  const failed = results.filter(result => !result.pass);
  document.querySelector("#status").textContent = `${results.length - failed.length}/${results.length} passed`;
  document.querySelector("#details").textContent = JSON.stringify(results, null, 2);
  document.body.dataset.result = failed.length ? "failed" : "passed";
};
size(600, 400, 1); render();

// 使用真实房间渲染入口，覆盖生产柜体和现成家具共同使用的描边路径。
const demo = document.createElement("section");
demo.innerHTML = `<h3>统一描边：书柜、写字台、椅子、沙发</h3>
  <p>可拖动旋转，滚轮缩放。左上轮廓轻，右下轮廓重；远看时线宽平滑收细。</p>
  <p><a href="?room">打开房间对照</a></p>
  <button data-view="normal">常规</button> <button data-view="far">缩远</button>
  <button data-view="reverse">另一视角</button> <button data-view="selected">选中书柜</button>
  <button data-view="blocked">碰撞书柜</button>
  <div style="position:relative"><canvas id="room-demo" style="width:100%;height:480px"></canvas></div>`;
document.body.insertBefore(demo, document.querySelector("details"));
const roomView = mountLayout(demo.querySelector("canvas"));
const item = (id, category, manufacture, x, y, width, depth, height) => ({
  id, category, manufacture, width, depth, height, z_start: 0, z_end: height,
  footprint: [[x,y],[x+width,y],[x+width,y+depth],[x,y+depth]],
});
const roomData = {room: {width_mm:3600,depth_mm:3000,height_mm:2800}, openings: [], obstacles: [], items: [
  item("bookcase", "bookcase", true, 100, 0, 900, 350, 1800),
  item("desk", "desk", false, 1300, 0, 1100, 600, 750),
  item("chair", "chair", false, 1450, 850, 500, 500, 850),
  item("sofa", "sofa", false, 2500, 1300, 1000, 850, 850),
]};
function showRoom(mode = "normal") {
  const selected = mode === "selected" || mode === "blocked";
  roomView.sync(roomData, {dims:false, readOnly:true, selectedId:selected ? "bookcase" : null, blockedId:mode === "blocked" ? "bookcase" : null});
  roomView.setView(mode === "reverse" ? 2.3 : 0.85, 0.56, mode === "far" ? 15000 : 7600, [1800,1500,950]);
  roomView.draw();
}
demo.querySelectorAll("button").forEach(button => { button.onclick = () => showRoom(button.dataset.view); });
function roomChecks(check) {
  showRoom();
  const meshes = [];
  window.__diag.itemsGroup.traverse(node => { if (node.userData.kind === "item") meshes.push(node); });
  check(new Set(meshes.map(mesh => mesh.userData.itemId)).size === 4
    && meshes.every(mesh => mesh.userData.cartoonInk && mesh.userData.ink.isLineSegments),
    "real room: manufactured cabinet and fixed furniture share whole-item masks and light seams");
  const bookcase=window.__diag.itemCache.get("bookcase").pickables[0];
  const lines=bookcase.userData.ink.geometry.getAttribute("position");
  let bottomEdges=0, topEdges=0;
  for (let i=0;i<lines.count;i+=2) {
    const a=new THREE.Vector3().fromBufferAttribute(lines,i).applyMatrix4(bookcase.matrixWorld);
    const b=new THREE.Vector3().fromBufferAttribute(lines,i+1).applyMatrix4(bookcase.matrixWorld);
    if (Math.abs(a.y)<0.49 && Math.abs(b.y)<0.49) bottomEdges++;
    if (a.y===1800 && b.y===1800) topEdges++;
  }
  check(bottomEdges===0 && topEdges>0,"real room: bookcase floor contact removes bottom seams and keeps top edges",{bottomEdges,topEdges});
  for (const [mode, color] of [["selected",0xf59e0b],["blocked",0xd93838]]) {
    showRoom(mode);
    const mesh = window.__diag.itemCache.get("bookcase").pickables[0];
    check(mesh.userData.cartoonInk.color === color && mesh.userData.ink.material.color.getHex() === color,
      `real room: cabinet ${mode} color reaches both rim and seams`);
  }
  showRoom();
}
showRoom();
if (new URLSearchParams(location.search).has("room")) {
  document.querySelector("#run").hidden = true;
  document.querySelector("#status").hidden = true;
  renderer.domElement.style.display = "none";
  document.querySelector("details").hidden = true;
}
if (new URLSearchParams(location.search).has("sofa")) {
  demo.hidden=true;
  document.querySelector("#run").onclick();
}
</script>
