# 柜类工艺目录 —— 车间填，代码只读。逐项口径见 craft-catalog.md。
#
# 单位一律毫米（mm）。缺项时的行为分两种，别混：
#   · 有常规值的     → 用它，并在决策台账里标成"助手假设"；
#   · 连常规值都没有 → 停问，不猜。
# 改数字就升一次 version：求解结果会记下"按哪一版算的"（可追溯）；
# 它**不进下游摘要**——几何没变就不重算下游。
version: draft-2026-10-02   # draft = 未经车间确认，只能用于草稿演示

# 平开门门宽的兜底区间。
# 上限是**硬**的：超过就换方案（增减格数）或停问；下限是**软**的：低于它只给一句代价提示，不拒。
door:
  max_width_mm: 450
  min_width_mm: 300

toe_kick_mm: 50             # 踢脚高的全局默认（与板件阶段的候选起点一致）

edge:
  # 收口条：**宽度不是固定值**——现场量完墙的斜度与缝宽再裁。目录只给两样：
  #   ① 允许的宽度区间（超出就要另想办法）；
  #   ② 柜体**净尺寸怎么扣**的策略（否则求解器每次都得停下来问）。
  # 具体这一排留多少，是现场/客户的约束（进 spaces[].constraints），不是车间常量。
  filler_allowance_mm: [18, 60]
  filler_policy: reserve_max   # 待确认：reserve_max（按上限扣，最保险）| reserve_typical（按常规值扣，超出现场加板）

# 柜类（kind）：求解器要知道"这是哪一类柜子"，才取得到下面的数字。
# 客户的说法由 LLM 映射到这几个键（"餐边柜" → sideboard），**代码不猜词**。
families:

  kitchen_base:               # 厨房地柜
    door_width_mm: [400, 450]
    depth_mm: 600             # 常规值；允许 550–650（外形含门）
    counter_height_mm: 830    # 台面完成面到地
    counter_thickness_mm: 15  # 常用台面厚；只用来推柜体高：830 − 15 = 815（派生值不进目录）
    toe_kick_mm: 100          # 常规值；上限 200（目前用到的最高）

  wardrobe:                   # 衣柜（平开门）
    door_width_mm: [300, 450]
    depth_mm: 600             # 外形（含门）

  sideboard:                  # 餐边柜 / 玄关薄柜（同族）
    door_width_mm: [350, 400]
    depth_mm: 350             # 外形（含门）

# ---------------------------------------------------------------------------
# 以下几项等车间后期给。**先不写空值**：空列表会被读成"没有约束"，
# 而我们要的是"缺项就停问"。
#
# unit_widths_mm:   # 常用单元宽档，升序去重（拆分取模数用）
# bays:             # 功能格最小净宽：long_hang / short_hang / stack / drawer / bulk / tall_item
# reach:            # 可达性高度带：comfortable_mm / low_mm / high_mm
# ---------------------------------------------------------------------------
