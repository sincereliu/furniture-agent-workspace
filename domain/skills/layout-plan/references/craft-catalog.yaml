# 柜类工艺目录 —— 车间填，代码只读。逐项口径见 craft-catalog.md。
#
# 单位一律毫米（mm）。
# 沿墙铺满只读 families.<kind>.door_width_mm 的上限，乘 2 当作一台的宽度上限。
# 收口、踢脚、台面高留在这里，铺墙时不扣、也不拿来停问。
# 改数字就升一次 version。
version: draft-2026-10-02   # draft = 未经车间确认，只能用于草稿演示

# 平开门单扇门宽。某柜类没写自己的区间时，用这里的上限。
door:
  max_width_mm: 450
  min_width_mm: 300

toe_kick_mm: 50             # 踢脚高的全局默认（与板件阶段的候选起点一致）

edge:
  # 收口条宽度：现场量缝再裁。目录只留允许区间和扣减策略，供车间对照。
  # 沿墙铺满不扣这段宽度，柜子宽度加起来等于这段空墙。
  filler_allowance_mm: [18, 60]
  filler_policy: reserve_max   # 待确认：reserve_max（按上限记）| reserve_typical（按常规值记）

# 柜类（kind）：沿墙铺满写在那一件上，用来取门宽上限。
# 客户的说法由 LLM 映射到这几个键（"餐边柜" → sideboard），代码不猜词。
families:

  kitchen_base:               # 厨房地柜
    door_width_mm: [400, 450]
    depth_mm: 600             # 常规值；允许 550–650（外形含门）
    counter_height_mm: 830    # 台面完成面到地
    counter_thickness_mm: 15  # 常用台面厚；只用来推柜体高：830 − 15 = 815（派生值不进目录）
    toe_kick_mm: 100          # 常规值；上限 200（目前用到的最高）

  wardrobe:                   # 衣柜（平开门）
    door_width_mm: [300, 450]
    depth_mm: 600             # 外形（含门）

  sideboard:                  # 餐边柜 / 玄关薄柜（同族）
    door_width_mm: [350, 400]
    depth_mm: 350             # 外形（含门）

# ---------------------------------------------------------------------------
# 下面几项等车间后期给，沿墙铺满现在不读。先不写空值。
#
# unit_widths_mm:   # 常用单元宽档
# bays:             # 功能格最小净宽：long_hang / short_hang / stack / drawer / bulk / tall_item
# reach:            # 可达性高度带：comfortable_mm / low_mm / high_mm
# ---------------------------------------------------------------------------
