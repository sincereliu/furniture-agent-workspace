# 吊柜板件拓扑 — 壁挂式吊柜的柜体骨架
# 本文件只声明围合面、语义面、无踢脚和前开口类型。
# 不包含坐标。门板等分、层板累加、三种背板几何由求解器执行。
# 不能只加 YAML 就支持新柜型。

name: 吊柜
description: "壁挂式吊柜，前开门，无踢脚，挂墙安装"
frame:
  front: "+y"
  top: "+z"

enclosure:
  left_side:
    type: panel
    semantic_face: left
    material: carcass
  right_side:
    type: panel
    semantic_face: right
    material: carcass
  top:
    type: panel
    semantic_face: top
    material: carcass
  bottom:
    type: panel
    semantic_face: bottom
    material: carcass
  back:
    type: back_panel
    semantic_face: back
    material: back
    mount_modes: [groove, insert, cover]
  front:
    type: opening
    semantic_face: front
    subtypes: [doors]

base:
  type: none   # 吊柜无踢脚

internals:
  # 层板由 spec.shelves 驱动（从上到下、固定/活动混排），不再用 count_field
  dividers: []
