# ============================================================================
# 硬件规格库 — 三合一 + 铰链
# ============================================================================
# 规格组决定工程参数（打孔），品牌决定 BOM 输出
# ============================================================================

# ── 三合一：一套 = 偏心轮 + 连接杆 + 预埋螺母 ────────────
three_in_one:
  standard:
    # 偏心轮（装在“边接触方”板件的板面 cam_face 上；具体板/面由连接拓扑决定）
    cam:
      diameter_mm: 12                 # 偏心轮本体直径
      hole_depth_mm: 13.5             # 沉孔深度
      rod_axis_to_cam_face_mm: 9      # 偏心轮安装面到连接杆轴线的距离（五金固定参数；投产前确认）
      cam_center_to_rod_head_mm: 0.5  # 偏心轮圆心到连接杆头端的固定距离（五金固定参数）
    # 连接杆（从“边接触方”板件的端面穿入，指向“面接触方”板件的预埋螺母）
    rod:
      diameter_mm: 8                  # 连接杆直径
      insertion_depth_mm: 33          # 连接杆插入板端深度
    # 预埋螺母（装在“面接触方”板件的板面上）
    nut:
      diameter_mm: 10                 # 预埋螺母直径
      depth_mm: 11                    # 预埋孔深度
    # 派生量（由代码计算，不落库）：
    #   轮孔圆心到杆端面 = rod.insertion_depth_mm + cam.cam_center_to_rod_head_mm = 33.5
    #   连接杆总长       = rod.insertion_depth_mm + nut.depth_mm              = 44
    brands:
      - name: 默认
        model: SJY-01

# ── 二合一：一套 = 偏心轮 + 连接杆（固定塑料件并入连接杆，不单列）──
two_in_one:
  standard:
    cam:                              # 偏心轮
      diameter_mm: 12                 # 偏心轮本体直径
      hole_depth_mm: 13.5             # 沉孔深度
      cam_center_to_edge_mm: 4.5      # 偏心轮圆心到端面的距离（五金固定参数）
    rod:                              # 连接杆（特殊螺丝，打在侧板）
      diameter_mm: 5                  # 连接杆直径
      depth_mm: 10                    # 打孔深度
    note: 活动层板标准连接件
    brands:
      - name: 默认
        model: EYJ-01

# ── 隔板钉：一套 = 单钉 ──────────────────────────────────
shelf_pin:
  standard:
    pin:                              # 钉
      diameter_mm: 5                  # 钉直径
      length_mm: 25                   # 钉长（待定，投产前确认）
      # 层板架在钉上：层板底面 = 钉中心线 + 半径(diameter_mm/2 = 2.5mm)
    pin_hole:                         # 侧板孔（装钉）
      diameter_mm: 5
      depth_mm: 9
    note: 轻载层板，安装简便
    brands:
      - name: 默认
        model: GBD-01

# ── 抽屉滑轨 ──────────────────────────────────────────
drawer_slides:
  三节轨:
    mounting: 侧装
    gap_requirement_mm: 13.0        # 每侧间隙（修正 12.5→13.0，投产前确认）
    extension: 100%                 # 全拉出
    standard_lengths_mm: [250, 300, 350, 400, 450, 500, 550, 600]
    brands:
      - name: 默认
        model: SJG-01
      - name: DTC
        model: DTC-3S
      - name: 悍高
        model: HG-3S

  隐藏轨:
    mounting: 底装
    gap_requirement_mm: 12.7        # 每侧间隙
    extension: 100%
    standard_lengths_mm: [270, 300, 350, 400, 450, 500, 550]
    brands:
      - name: 默认
        model: YCG-01
      - name: Blum
        model: 760H

# ── 铰链 ──────────────────────────────────────────────
hinges:
  HJ-100:
    angle: 100
    cup: { diameter_mm: 35, depth_mm: 13 }
    edge_offset_mm: 5                # 铰链臂侧边距（杯孔边到门侧边的距离），随厂规/五金基础参数
    door_thickness_mm: [14, 22]      # 适用门厚范围 [min, max]，超出由校验拦截
    brands:
      - name: 默认
        model: HJ-100
