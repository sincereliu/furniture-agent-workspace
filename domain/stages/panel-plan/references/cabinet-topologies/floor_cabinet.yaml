# 落地柜板件拓扑 — 标准落地柜/储物柜的柜体骨架
# 本文件只声明围合面、语义面、有无踢脚、抽屉区类型。
# 不包含坐标。门板等分、层板累加、抽屉尺寸链、三种背板几何由求解器执行。
# 不能只加 YAML 就支持新柜型。

name: 落地柜
description: "标准落地柜（储物柜/底柜），前开门，背面靠墙，底部踢脚"
frame:
  front: "+y"
  top: "+z"

enclosure:
  left_side:
    type: panel
    semantic_face: left
    material: carcass
  right_side:
    type: panel
    semantic_face: right
    material: carcass
  top:
    type: panel
    semantic_face: top
    material: carcass
  bottom:
    type: panel
    semantic_face: bottom
    material: carcass
  back:
    type: back_panel
    semantic_face: back
    material: back
    mount_modes: [groove, insert, cover]
  front:
    type: opening
    semantic_face: front
    subtypes: [doors]

base:
  type: toe_kick
  height_field: toe_kick_height
  faces: [front, back]
  rear_offset_field: toe_kick_reveal_back
  front_offset_field: toe_kick_reveal_front
  support_count_field: toe_kick_support_count

internals:
  # 层板由 spec.shelves 驱动（从上到下、固定/活动混排），不再用 count_field
  drawers:
    type: zone                 # 抽屉区：占满内部净高、显式净高或某一格（由 spec 决定）
    count_field: drawer_count
    face_mode: board           # 有前板；spec.drawer_front_board=false 时抽面直接当盒体前墙
    # 净空、层缝和抽屉板厚均来自已准入的 FurnitureSpec；拓扑不持有方案默认值。
    # 抽面与盒体的关系（覆盖量）由格高与间隙算出，不再按抽屉位置写死。
  dividers: []
