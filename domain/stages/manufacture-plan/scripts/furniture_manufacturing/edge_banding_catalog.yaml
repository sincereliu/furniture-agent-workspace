# ============================================================================
# 封边条目录 — 单一真源
# ============================================================================
# 键规则：全小写；键 = 稳定代号（引用用），name = 可读全名（可改）。
# 封边条宽度（= 板件厚度）与颜色（= 同色，来自 surface 花色）是派生属性，
# 不进目录，由代码确定性计算。
# ============================================================================

# ── 材质（决定工艺：glue 胶粘 / laser 激光无胶线）──
material:
  abs:   { name: ABS封边, process: glue }
  pvc:   { name: PVC封边, process: glue }
  laser: { name: 激光封边, process: laser }

# ── 封边条自身厚度（贴上去后凸出的厚度）──
thickness:
  t0_8: { name: 0.8mm, value_mm: 0.8 }
  t1_0: { name: 1.0mm, value_mm: 1.0 }
  t2_0: { name: 2.0mm, value_mm: 2.0 }
