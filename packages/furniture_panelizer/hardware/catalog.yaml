# ============================================================================
# 硬件规格库 — 三合一 + 铰链
# ============================================================================
# 规格组决定工程参数（打孔），品牌决定 BOM 输出
# ============================================================================

# ── 三合一连接件 ────────────────────────────────────────
# 业内统一标准，国产品牌规格一致
three_in_one:
  标准:
    variant_group: 三合一标准
    eccentric_wheel:
      diameter_mm: 15
      thickness_mm: 10
      hole_diameter_mm: 20      # 侧板大孔（安装偏心轮）
      hole_depth_mm: 12
    pre_embedded_nut:
      diameter_mm: 8
      length_mm: 12
    connecting_rod:
      diameter_mm: 6
      length_mm: 36
    # 母件孔（侧板面）：偏心轮安装孔
    female_hole:
      face_diameter_mm: 20     # 盘头孔直径
      face_depth_mm: 12        # 盘头孔深度
      rod_hole_diameter_mm: 8  # 连杆横孔直径
      rod_hole_depth_mm: 34    # 连杆横孔深度
    # 公件孔（板端）：预埋螺母 + 连杆
    male_hole:
      nut_diameter_mm: 8
      nut_depth_mm: 12
      rod_diameter_mm: 5       # 引孔直径（比连杆略小）
      rod_depth_mm: 34         # 引孔深度
    brands:
      - name: 默认
        model: SJY-01

# ── 铰链 ──────────────────────────────────────────────

hinges:
  # ── 国内 35mm 杯 ────────────────────────────────────
  domestic-35mm-full-overlay-100:
    variant_group: 国内35mm杯全盖
    cup: { diameter_mm: 35, depth_mm: 13 }
    overlay: full
    angle: 100
    base_height_mm: 0
    door_thickness_mm: [14, 22]
    note: 标准全盖铰链
    brands:
      - name: 默认
        model: HJ-100-F
      - name: DTC
        model: C80-100
      - name: 悍高
        model: HG-100F

  domestic-35mm-full-overlay-165:
