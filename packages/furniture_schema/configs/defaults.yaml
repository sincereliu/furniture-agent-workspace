# ============================================================
# 默认参数 — defaults.yaml
# ============================================================

# 尺寸默认值
dimensions:
  board_thickness: 18.0
  back_thickness: 9.0
  door_thickness: 18.0
  toe_kick_height: 50.0
  back_offset: 18.0
  door_margin: 1.5
  door_hinge_gap: 2.0

# 品类默认结构参数
structure_defaults:
  _common:
    has_back: true
    back_type: "insert"
  # 落地柜 — 侧板落地，顶板嵌侧板，有踢脚线，有背板
  落地柜:
    shelf_count: 4
    n_doors: 2
    top_on_side: false
    has_toe_kick: true
  # 吊柜 — 侧板通高，顶底板嵌侧板，无踢脚线
  吊柜:
    shelf_count: 2
    n_doors: 2
    top_on_side: false
    has_toe_kick: false
  # 衣柜 — 基于落地柜，带挂衣杆
  衣柜:
    shelf_count: 4
    n_doors: 2
    top_on_side: false
    has_toe_kick: true
    has_hanging_rod: true

# 加工公差
tolerances:
  panel_length: "±0.5"
  panel_width: "±0.5"
  hole_position: "±0.2"