    variant_group: 国内35mm杯全盖
    cup: { diameter_mm: 35, depth_mm: 13 }
    overlay: full
    angle: 100
    base_height_mm: 0
    door_thickness_mm: [14, 22]
    note: 标准全盖铰链
    brands:
      - name: 默认
        model: HJ-100-F
      - name: DTC
        model: C80-100
      - name: 悍高
