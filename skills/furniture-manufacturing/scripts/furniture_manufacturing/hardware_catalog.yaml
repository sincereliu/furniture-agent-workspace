# ============================================================================
# 硬件规格库 — 三合一 + 铰链
# ============================================================================
# 规格组决定工程参数（打孔），品牌决定 BOM 输出
# ============================================================================

# ── 三合一连接件 ────────────────────────────────────────
three_in_one:
  标准:
    variant_group: 三合一标准
    # 偏心轮（母件，安装在侧板面上）
    eccentric_wheel:
      diameter_mm: 12            # 偏心轮本体直径
      hole_depth_mm: 13.5        # 沉孔深度
      center_offset_from_edge_mm: 33.5   # 偏心轮圆心距板前边
    # 连接杆
    connecting_rod:
      diameter_mm: 8             # 连接杆直径
      length_mm: 36              # 连接杆总长
      insertion_depth_mm: 33     # 连接杆插入板端深度
    # 预埋件（安装在板端）
    pre_embedded_nut:
      diameter_mm: 10            # 预埋件直径
      depth_mm: 11               # 预埋孔深度
    brands:
      - name: 默认
        model: SJY-01

# ── 活动层板连接件 ────────────────────────────────────────
shelf_connectors:
  二合一:
    variant_group: 二合一连接件
    连接杆直径: 5mm
    注塑件直径: 8mm
    侧板孔: { diameter_mm: 10, depth_mm: 12 }
    层板孔: { diameter_mm: 5, depth_mm: 10 }
    note: 活动层板标准连接件
    brands:
      - name: 默认
        model: EYJ-01

  隔板钉:
    variant_group: 隔板钉
    钉径: 3mm
    钉长: 25mm
    侧板孔: { diameter_mm: 3, depth_mm: 8 }
    note: 轻载层板，安装简便
    brands:
      - name: 默认
        model: GBD-01

# ── 抽屉滑轨 ──────────────────────────────────────────
drawer_slides:
  三节轨:
    variant_group: 国产三节轨
    mounting: 侧装
    gap_requirement_mm: 12.5        # 每侧间隙
    extension: 100%                 # 全拉出
    standard_lengths_mm: [250, 300, 350, 400, 450, 500, 550, 600]
    brands:
      - name: 默认
        model: SJG-01
      - name: DTC
        model: DTC-3S
      - name: 悍高
        model: HG-3S

  隐藏轨:
    variant_group: 国产隐藏轨
    mounting: 底装
    gap_requirement_mm: 12.7        # 每侧间隙
    extension: 100%
    standard_lengths_mm: [270, 300, 350, 400, 450, 500, 550]
    brands:
      - name: 默认
        model: YCG-01
      - name: Blum
        model: 760H

# ── 铰链 ──────────────────────────────────────────────

hinges:
